# Optional: local PostgreSQL ku. Unakku already install irundha idhu venaam.
services:
  db:
    image: postgres:16
    container_name: restnest-db
    environment:
      POSTGRES_DB: restnest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - restnest-data:/var/lib/postgresql/data
volumes:
  restnest-data:
