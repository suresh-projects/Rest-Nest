
spring.application.name=restnest
server.port=8081

# PostgreSQL - Neon Cloud Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
restnest.jwt.secret=${JWT_SECRET}
restnest.jwt.expiration-ms=86400000

# Default Admin Configuration
restnest.admin.email=${ADMIN_EMAIL:admin@restnest.com}
restnest.admin.password=${ADMIN_PASSWORD}

# File Upload
restnest.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
server.port=${PORT:8081}